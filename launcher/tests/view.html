<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Launcher browser regression checks</title>
<h1>Launcher browser regression checks</h1>
<p>Local simulated adapters only. No game, native bridge or device access.</p>
<ol id="results"></ol>
<iframe src="../index.html" title="Frontend under test" width="900" height="600"></iframe>
<script type="module">
const frame = document.querySelector('iframe');
await new Promise(resolve => frame.addEventListener('load', resolve, {once:true}));
const win = frame.contentWindow, doc = win.document;
const tick = () => new Promise(resolve => setTimeout(resolve, 0));
const snapshot = (status = 'idle', capabilities = {selectFiles:true, prepare:true}) =>
  ({status, capabilities, progress:null, message:'Simulated host status'});
const assert = (condition, message) => { if (!condition) throw new Error(message); };
async function route(view) {
  if (win.location.hash === `#${view}`) return;
  const changed = new Promise(resolve => win.addEventListener('hashchange', resolve, {once:true}));
  win.location.hash = view;
  await changed;
}
async function fixture() {
  let listener, state = snapshot();
  const adapter = {version:1, getState:async () => state,
    subscribe:fn => { listener = fn; fn(state); return () => {}; },
    invoke:async () => {}, emit:value => { state = value; listener(value); }};
  await win.launcher.connect(adapter);
  return adapter;
}
async function check(name, run) {
  const result = document.createElement('li');
  try { await run(); result.textContent = `PASS: ${name}`; }
  catch (error) { result.textContent = `FAIL: ${name}: ${error.message}`; }
  document.querySelector('#results').append(result);
}
await check('Pause is enabled and focused while Prepare remains pending', async () => {
  const adapter = await fixture(); await route('setup'); let finish;
  adapter.invoke = action => {
    if (action === 'prepare') {
      adapter.emit(snapshot('preparing', {pause:true}));
      return new Promise(resolve => { finish = resolve; });
    }
    adapter.emit(snapshot('paused', {resume:true}));
    return Promise.resolve();
  };
  const prepare = doc.querySelector('[data-action="prepare"]');
  prepare.focus(); prepare.click();
  try {
    const pause = doc.querySelector('[data-action="pause"]');
    assert(pause && !pause.disabled, 'Pause unavailable');
    assert(doc.activeElement === pause, 'Focus did not follow Prepare to Pause');
    pause.click(); await tick();
    assert(doc.activeElement?.dataset.action === 'resume', 'Focus did not follow Pause to Resume');
  } finally { finish(); await tick(); }
});
await check('An immediate action restores keyboard focus after its request settles', async () => {
  await fixture(); await route('setup');
  const select = doc.querySelector('[data-action="selectFiles"]');
  select.focus(); select.click(); await tick();
  assert(doc.activeElement?.dataset.action === 'selectFiles', 'Selection focus lost');
});
await check('Navigation focus survives background state updates', async () => {
  const adapter = await fixture(); await route('home');
  doc.querySelector('[data-view="diagnostics"]').focus();
  adapter.emit(snapshot());
  assert(doc.activeElement?.dataset.view === 'diagnostics', 'Navigation focus lost');
});
await check('View navigation keeps its main focus during later state updates', async () => {
  const adapter = await fixture(); await route('setup');
  doc.querySelector('[data-action="selectFiles"]').focus();
  await route('home'); await route('setup');
  adapter.emit(snapshot());
  assert(doc.activeElement === doc.querySelector('main'), 'An old action stole the new view focus');
});
await check('Background updates do not steal focus from the About dialog', async () => {
  const adapter = await fixture();
  doc.querySelector('#about').click();
  const close = doc.querySelector('#close-about'); close.focus();
  adapter.emit(snapshot());
  assert(doc.activeElement === close, 'Dialog focus stolen');
  close.click();
});
function enter(key, value) {
  const field = doc.querySelector(`[data-note="${key}"]`);
  field.value = value; field.dispatchEvent(new win.Event('input', {bubbles:true}));
  return field;
}
function previewDraft() { doc.querySelector('[data-feedback-form]').requestSubmit(); }
await check('Feedback preview is literal, survives host updates and requires review before copy', async () => {
  const adapter = await fixture(); await route('diagnostics');
  doc.querySelector('[data-view="feedback"]').click(); await tick();
  const actual = enter('actual', '<b>user note</b>'); actual.focus(); actual.setSelectionRange(2, 5);
  adapter.emit(snapshot('preparing', {pause:true}));
  assert(doc.activeElement === actual && actual.selectionStart === 2 && actual.selectionEnd === 5, 'Host update replaced draft/focus');
  previewDraft();
  const output = doc.querySelector('#feedback-preview');
  assert(output.value.includes('<b>user note</b>') && !doc.querySelector('.feedback b'), 'Notes interpreted as HTML');
  const copy = doc.querySelector('[data-feedback-copy]');
  assert(copy.disabled, 'Copy enabled before review');
  const original = Object.getOwnPropertyDescriptor(win.navigator, 'clipboard');
  const writes = [];
  Object.defineProperty(win.navigator, 'clipboard', {configurable:true, value:{writeText:async value => { writes.push(value); }}});
  try {
    doc.querySelector('[data-feedback-consent]').click(); copy.click(); await tick();
    assert(writes.length === 1 && writes[0] === output.value, 'Copy did not use the reviewed preview');
    assert(doc.querySelector('[data-feedback-status]').textContent.includes('Draft copied'), 'Copy completion missing');
    adapter.emit(snapshot());
    assert(doc.querySelector('#feedback-preview') === output && output.value === writes[0], 'Host update changed reviewed text');
    enter('actual', 'Revised note');
    assert(copy.disabled && output.value === '' && doc.querySelector('[data-feedback-preview]').hidden, 'Edited draft allowed stale copy');
  } finally {
    if (original) Object.defineProperty(win.navigator, 'clipboard', original); else delete win.navigator.clipboard;
  }
});
await check('Feedback refuses raw/invalid metadata without exposing it or retaining an old preview', async () => {
  await route('feedback'); enter('actual', 'A check failed'); previewDraft();
  enter('metadata', '{"error":"PRIVATE_SENTINEL"}'); previewDraft();
  assert(doc.querySelector('[data-feedback-preview]').hidden && doc.querySelector('[data-feedback-copy]').disabled, 'Invalid metadata accepted');
  assert(doc.querySelector('#feedback-preview').value === '', 'Old draft retained');
  assert(!doc.querySelector('[data-feedback-error]').textContent.includes('PRIVATE_SENTINEL'), 'Raw error leaked');
  enter('metadata', '');
});
await check('Clipboard refusal offers manual copy; navigation retains notes until reload', async () => {
  await route('feedback'); enter('actual', 'Preserved note'); previewDraft();
  const original = Object.getOwnPropertyDescriptor(win.navigator, 'clipboard');
  Object.defineProperty(win.navigator, 'clipboard', {configurable:true, value:{writeText:async () => { throw new Error('PRIVATE_SENTINEL'); }}});
  try {
    doc.querySelector('[data-feedback-consent]').click(); doc.querySelector('[data-feedback-copy]').click(); await tick();
    const output = doc.querySelector('#feedback-preview');
    assert(doc.activeElement === output && output.selectionEnd === output.value.length, 'Manual copy not selectable');
    const status = doc.querySelector('[data-feedback-status]').textContent;
    assert(status.includes('Clipboard unavailable') && !status.includes('PRIVATE_SENTINEL'), 'Clipboard failure leaked or claimed success');
    await route('home'); await route('feedback');
    assert(doc.querySelector('[data-note="actual"]').value === 'Preserved note', 'Navigation lost notes');
    assert(doc.querySelector('[data-feedback-preview]').hidden, 'Navigation retained sharing consent');
  } finally {
    if (original) Object.defineProperty(win.navigator, 'clipboard', original); else delete win.navigator.clipboard;
  }
});
document.title = document.querySelector('#results').textContent.includes('FAIL:')
  ? 'FAIL · Launcher browser checks' : 'PASS · Launcher browser checks';
</script></html>
