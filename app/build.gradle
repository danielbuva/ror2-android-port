plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.ror2lab.x86_64'
    compileSdk 34

    defaultConfig {
        applicationId "dev.ror2lab.x86_64"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0.0-x64"

        ndk {
            abiFilters "x86_64"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -march=x86-64 -fPIC -O2"
                arguments "-DANDROID_ABI=x86_64", "-DANDROID_PLATFORM=android-23"
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
