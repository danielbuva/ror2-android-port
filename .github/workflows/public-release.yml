# Publishes public transformations only. This never builds/uploads an APK.
# An authorized maintainer must provision the reviewed plan, trust public key,
# external publisher signing secret and protected environment before tagging.
name: public-release

on:
  push:
    tags:
      - 'owner-v[0-9]*'

permissions:
  contents: read

concurrency:
  group: public-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: public-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Validate immutable tag and provisioned public release inputs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_PLAN: ${{ vars.PUBLIC_RELEASE_PLAN_PATH }}
          PUBLISHER_KEY_ID: ${{ vars.PUBLISHER_KEY_ID }}
          PUBLISHER_PUBLIC_KEY: ${{ vars.PUBLISHER_PUBLIC_KEY }}
          MINIMUM_INSTALLER_VERSION: ${{ vars.PUBLIC_MINIMUM_INSTALLER_VERSION || '3' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^owner-v([1-9][0-9]*)$ ]] || { echo 'Expected owner-v<positive publisher release code>'; exit 1; }
          code="${BASH_REMATCH[1]}"
          (( ${#code} <= 10 )) && (( code <= 2100000000 )) || { echo 'Invalid publisher release code'; exit 1; }
          [[ -n "$RELEASE_PLAN" && -n "$PUBLISHER_KEY_ID" && -n "$PUBLISHER_PUBLIC_KEY" ]] || { echo 'Release plan and publisher trust provisioning are required'; exit 1; }
          [[ "$MINIMUM_INSTALLER_VERSION" =~ ^[1-9][0-9]*$ ]] && (( ${#MINIMUM_INSTALLER_VERSION} <= 10 )) && (( MINIMUM_INSTALLER_VERSION >= 3 && MINIMUM_INSTALLER_VERSION <= 2100000000 )) || { echo 'Invalid minimum installer version'; exit 1; }
          echo "RELEASE_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "RELEASE_MINIMUM_INSTALLER_VERSION=$MINIMUM_INSTALLER_VERSION" >> "$GITHUB_ENV"
          umask 077
          printf '%s\n' "$PUBLISHER_PUBLIC_KEY" > "$RUNNER_TEMP/publisher-public.pem"
      - name: Public-source privacy audit and synthetic release tests
        run: |
          python scripts/audit-public.py
          python -m unittest discover -s tests -p 'test_phone_release.py' -v
          python -m unittest discover -s tests -p 'test_alpha_release_policy.py' -v
          python -m unittest discover -s tests -p 'test_public_release.py' -v
          python -m unittest discover -s tests -p 'test_phone_updates.py' -v
          python -m unittest discover -s tests -p 'test_phone_game_import.py' -v
          python -m unittest discover -s tests -p 'test_phone_install*.py' -v
      - name: Build public tools and sign release manifest with existing publisher key
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_PLAN: ${{ vars.PUBLIC_RELEASE_PLAN_PATH }}
          PUBLISHER_KEY_ID: ${{ vars.PUBLISHER_KEY_ID }}
          PUBLISHER_PRIVATE_KEY: ${{ secrets.PUBLISHER_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PUBLISHER_PRIVATE_KEY" ]] || { echo 'Publisher signing key is not provisioned'; exit 1; }
          umask 077
          key="$RUNNER_TEMP/publisher-private.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$PUBLISHER_PRIVATE_KEY" > "$key"
          unset PUBLISHER_PRIVATE_KEY
          python tools/phone-build/owner-apk/public_release.py \
            --plan "$RELEASE_PLAN" --output "$RUNNER_TEMP/public-release" \
            --version "$RELEASE_TAG" --version-code "$RELEASE_VERSION_CODE" \
            --minimum-installer-version "$RELEASE_MINIMUM_INSTALLER_VERSION" \
            --key-id "$PUBLISHER_KEY_ID" --signing-key "$key" \
            --public-key "$RUNNER_TEMP/publisher-public.pem"
      - name: Publish exactly the verified public assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "$RELEASE_TAG" \
            --notes 'Signed public reconstruction tools and recipes only. Owners supply legitimate game inputs; no game APK or game-derived content is distributed. Device/game readiness is not implied.' \
            "$RUNNER_TEMP/public-release/release.json" \
            "$RUNNER_TEMP/public-release/release.sig" \
            "$RUNNER_TEMP/public-release/public-tools.zip"
