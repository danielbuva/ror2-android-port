# Host checks that need no game files, Unity editor or device.
# Toolchain tests skip themselves here; device acceptance stays manual (see AGENTS.md).
name: host-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # journal index dates come from git blame
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"  # matches the workstation lab venv
          # Download/wheel cache only; never restore a venv or generated lab data.
          # setup-python also keys this on the runner OS/architecture and Python.
          cache: pip
          cache-dependency-path: tools/lab-requirements.txt
      - name: Install lab requirements
        run: python -m pip install -r tools/lab-requirements.txt
      # Lint and format-check touched Python files (ruff.toml explains the rule set).
      - name: Ruff (changed Python files)
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            base="$BEFORE_SHA"
            if [[ "$base" =~ ^0+$ ]]; then
              base="$(git hash-object -t tree /dev/null)"
            fi
          else
            base="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"
          fi
          git diff --name-only --diff-filter=ACMR -z "$base" HEAD -- '*.py' > "$RUNNER_TEMP/changed-python-files"
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < "$RUNNER_TEMP/changed-python-files"
          if (( ${#files[@]} == 0 )); then
            echo "No changed Python files."
            exit 0
          fi
          ruff check -- "${files[@]}"
          ruff format --check -- "${files[@]}"
      - name: Public-repository audit
        run: python scripts/audit-public.py
      - name: Journal index is current
        run: python scripts/journal-index.py --check
      - name: README actions are current
        run: python scripts/readme-actions.py --check
      - name: Host tests (fresh clone, no work/)
        run: python scripts/host-tests.py --workers 4 --report "$RUNNER_TEMP/host-test-results.json"
      - name: Host-test outcomes and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/host-test-results.json
          if-no-files-found: ignore
