name: Build x64 APK

on:
  push:
    branches: [ "*" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android x64 (x86_64) APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 34, Build-Tools 34.0.0 & NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Sync launcher web assets into Android APK assets
        run: |
          mkdir -p app/src/main/assets/owner-bootstrap
          cp -f tools/phone-build/owner-apk/index.html app/src/main/assets/owner-bootstrap/index.html
          cp -f tools/phone-build/owner-apk/owner-host.js app/src/main/assets/owner-bootstrap/owner-host.js
          cp -f launcher/app.js app/src/main/assets/owner-bootstrap/app.js
          cp -f launcher/controller.js app/src/main/assets/owner-bootstrap/controller.js
          cp -f launcher/feedback.js app/src/main/assets/owner-bootstrap/feedback.js
          cp -f launcher/style.css app/src/main/assets/owner-bootstrap/style.css
          cp -f launcher/background.png app/src/main/assets/owner-bootstrap/background.png

      - name: Build x64 (x86_64) APK via Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Assemble Debug x64 APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp -f app/build/outputs/apk/debug/app-debug.apk ror2-android-x64-debug.apk

      - name: Verify x86_64 Native Libraries Inside APK
        run: |
          unzip -l ror2-android-x64-debug.apk | grep "lib/x86_64/"
          if unzip -l ror2-android-x64-debug.apk | grep "lib/arm64-v8a/"; then
            echo "Error: arm64-v8a libraries found in x64-only APK!" >&2
            exit 1
          fi

      - name: Upload x64 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ror2-android-x64-apk
          path: ror2-android-x64-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ror2-android-x64-debug.apk
          generate_release_notes: true
