# Host CI lints and format-checks every Python file a change touches (cleanup plan Phase 5).
# scripts/ and tests/ are ruff-formatted (J518). Star imports (`from common import *`) stay,
# so F403/F405 are off; F401/F841 stay off because common.py's unused-looking imports are
# re-exported through that star import and some unused variables hold side-effect calls.
target-version = "py311"
line-length = 160
extend-exclude = ["work", ".local", "smoke", "android", "docs"]
# CI passes explicit paths, which otherwise bypass directory exclusions.
force-exclude = true

[lint]
select = ["F", "E4", "E7", "E9"]
ignore = ["F401", "F403", "F405", "F841", "E402", "E731", "E741"]
